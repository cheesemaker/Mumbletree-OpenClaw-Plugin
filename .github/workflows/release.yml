name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - run: sha256sum mumbletree-chat-*.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mumbletree-chat-*.tgz
            SHA256SUMS
          generate_release_notes: true
